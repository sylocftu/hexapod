name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Minimal default permissions for all jobs
permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install linting tools
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 software/ --config .flake8

      - name: Run black (check mode)
        run: black --check software/

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (excluding hardware-only packages)
        run: |
          pip install \
            fastapi==0.110.0 \
            "uvicorn[standard]==0.29.0" \
            smbus2==0.4.3 \
            numpy==1.26.4 \
            scipy==1.13.0 \
            pydantic==2.6.4 \
            websockets==12.0 \
            python-multipart==0.0.9 \
            pytest==8.1.1 \
            pytest-asyncio==0.23.6 \
            httpx==0.27.0

      - name: Install hexapod-core package (editable)
        run: pip install -e software/

      - name: Run pytest
        run: pytest software/tests/ -v --tb=short

  # ── Docker build ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build (all images)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build hexapod-core image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.core
          push: false
          tags: hexapod-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build hexapod-ui image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ui
          push: false
          tags: hexapod-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build hexapod-vision image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.vision
          push: false
          tags: hexapod-vision:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
