server {
    listen 80;
    server_name _;

    # Serve static UI files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Proxy REST API to core service
    location /api/ {
        proxy_pass         http://hexapod-core:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # Proxy WebSocket to core service
    location /ws/ {
        proxy_pass         http://hexapod-core:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # Proxy video stream (via vision service)
    location /stream/ {
        proxy_pass         http://hexapod-vision:8001/;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_set_header   Host $host;
    }
}
